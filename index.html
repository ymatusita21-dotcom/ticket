<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1f1b16">
  <title>電子チケット</title>
  <style>
    :root { --band: #3b3227; --band2: #5a4a36; --paper: #fcfaf5; --ink: #2f2a24; --sub: #8b8275; --line: #e2dac9; --bg: #1f1b16; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; -webkit-text-size-adjust: 100%; min-height: 100vh; }
    .wrap { max-width: 440px; margin: 0 auto; padding: 18px 14px calc(36px + env(safe-area-inset-bottom)); }
    .brand { color: #cbbf9f; text-align: center; font-size: 11px; letter-spacing: .4em; margin: 4px 0 12px; }
    .ticket { background: var(--paper); border-radius: 18px; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
    .top { padding: 20px 22px 18px; background: linear-gradient(135deg, var(--band), var(--band2)); color: #fff; text-align: center; transition: background .6s; }
    .top.in { background: linear-gradient(120deg, #059669, #10b981, #0ea5e9, #10b981, #059669); background-size: 400% 400%; animation: flow 6s ease infinite; }
    @keyframes flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .in-badge { display: inline-block; margin-bottom: 8px; padding: 4px 14px; border-radius: 999px; background: rgba(255,255,255,.25); font-weight: 800; font-size: 14px; letter-spacing: .06em; }
    .crown { font-size: 12px; opacity: .85; letter-spacing: .08em; }
    .title { font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 21px; font-weight: 600; line-height: 1.45; margin-top: 4px; letter-spacing: .04em; }
    .when { margin-top: 12px; font-size: 20px; font-weight: 800; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    .venue { font-size: 13px; opacity: .9; margin-top: 2px; }
    .mid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; padding: 16px 22px; }
    .k { font-size: 11px; color: var(--sub); letter-spacing: .08em; }
    .v { font-size: 16px; font-weight: 700; margin-top: 1px; overflow-wrap: anywhere; }
    .v.ok { color: #059669; }
    .seat { grid-column: 1 / -1; text-align: center; padding: 10px; border-radius: 12px; background: #f3ecdc; }
    .seat .v { font-size: 28px; font-weight: 900; letter-spacing: .06em; }
    .warn { margin: 0 22px 14px; padding: 10px 12px; border-radius: 10px; background: #fff1f0; color: #a8322a; font-weight: 700; font-size: 13px; text-align: center; }
    .cut { position: relative; height: 0; border-top: 2px dashed #d8cfbd; margin: 0 16px; }
    .cut::before, .cut::after { content: ""; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); }
    .cut::before { left: -29px; } .cut::after { right: -29px; }
    .bottom { padding: 16px 22px 22px; text-align: center; }
    .lead { font-weight: 800; font-size: 14px; margin-bottom: 8px; }
    .qr { width: min(68vw, 250px); margin: 0 auto; background: #fff; padding: 8px; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); }
    .qr svg { display: block; width: 100%; height: auto; }
    .wait { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; color: #6b6358; font-size: 12px; line-height: 1.5; }
    .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #22c55e; animation: blink 1.2s infinite; }
    .dot.off { background: #f59e0b; animation: none; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
    .stamp { width: 150px; height: 150px; margin: 4px auto 6px; border-radius: 50%; border: 5px solid #059669; color: #059669; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-12deg); font-weight: 900; }
    .stamp b { font-size: 34px; letter-spacing: .06em; line-height: 1.1; }
    .stamp span { font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stamp.pop { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes pop { 0% { transform: rotate(-12deg) scale(2.2); opacity: 0; } 100% { transform: rotate(-12deg) scale(1); opacity: 1; } }
    .clock { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .04em; margin-top: 8px; }
    .cdate { font-size: 13px; color: var(--sub); }
    .note { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #ecfdf5; color: #047857; font-size: 13px; font-weight: 700; line-height: 1.6; }
    .gift { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #f3ecdc; color: #5a4a36; font-weight: 800; font-size: 15px; }
    .gift small { display: block; font-size: 13px; margin-top: 3px; }
    .gift.todo { background: #fef3c7; color: #92400e; box-shadow: 0 0 0 2px #f59e0b inset; }
    .gift.todo.in { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 2px #f59e0b inset, 0 0 0 0 rgba(245,158,11,.5); } 50% { box-shadow: 0 0 0 2px #f59e0b inset, 0 0 0 10px rgba(245,158,11,0); } }
    .btn { display: inline-block; margin-top: 14px; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .foot { color: #a79d88; font-size: 11px; text-align: center; margin-top: 14px; line-height: 1.7; }
    .msg { margin-top: 40px; padding: 24px 20px; border-radius: 16px; background: var(--paper); text-align: center; line-height: 1.8; }
    .msg b { display: block; font-size: 17px; margin-bottom: 6px; }
    /* キャストの写真 (公演ポータルで「キャスト写真: 出す」の公演)。応援キャストは大きく、居ない予約は全員を小さく */
    .oshi { padding: 16px 22px 4px; text-align: center; }
    .oshi .k { margin-bottom: 8px; }
    .oshi-list { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .oshi-one { flex: 0 1 200px; min-width: 0; }
    .oshi-list.many .oshi-one { flex-basis: 130px; }
    .ph { aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: #f3ecdc; box-shadow: 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 28px; font-weight: 800; }
    .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .oshi .role { font-size: 11px; color: var(--sub); margin-top: 8px; }
    .oshi .nm { font-size: 17px; font-weight: 800; }
    .castbox { margin-top: 14px; padding: 14px 14px 16px; border-radius: 18px; background: var(--paper); }
    .castbox .k { text-align: center; letter-spacing: .3em; margin-bottom: 10px; }
    .cast-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
    .cast-grid .ph { border-radius: 10px; font-size: 18px; }
    .cast-grid .role { font-size: 9px; color: var(--sub); margin-top: 4px; line-height: 1.3; overflow-wrap: anywhere; }
    .cast-grid .nm { font-size: 11px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .cast-grid > div { text-align: center; min-width: 0; }
    /* ===== 仕掛け (公演ポータルの「電子チケットの仕掛け」でオンにした公演だけ) ===== */
    .btn.pri { background: var(--band); color: #fff; border-color: var(--band); }
    .btn.mini { margin-top: 8px; padding: 5px 12px; font-size: 12px; }
    a.btn { text-decoration: none; }
    /* ④ カウントダウン */
    .cd { margin-bottom: 12px; padding: 10px; border-radius: 12px; background: #f3ecdc; }
    .cd small { display: block; font-size: 11px; color: var(--sub); letter-spacing: .1em; }
    .cd b { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    .live { position: fixed; inset: 0; z-index: 40; background: #050508; color: #8a8494; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; line-height: 1.9; }
    .live b { color: #c9c3d3; font-size: 18px; letter-spacing: .1em; }
    .live .moon { font-size: 40px; margin-bottom: 10px; opacity: .6; }
    .live button { margin-top: 26px; background: transparent; color: #6f6a78; border: 1px solid #2c2a33; border-radius: 999px; padding: 8px 18px; font-family: inherit; font-size: 12px; }
    /* ⑥ 何回目のご来場 */
    .visit { margin: 0 22px 14px; padding: 8px 12px; border-radius: 10px; background: #fff7e6; color: #8a5a12; font-weight: 800; font-size: 13px; text-align: center; }
    /* ③ 座席の図 */
    .smap { margin-top: 10px; }
    .stage { background: var(--band); color: #fff; font-size: 11px; letter-spacing: .3em; padding: 4px; border-radius: 6px; margin-bottom: 8px; }
    .sgrid { display: grid; gap: 2px; }
    .sgrid i { display: block; aspect-ratio: 1; border-radius: 2px; }
    .sgrid i.s { background: #d9d0bf; }
    .sgrid i.me { background: #e11d48; box-shadow: 0 0 0 2px #fff, 0 0 8px 2px rgba(225,29,72,.7); animation: blink 1.2s infinite; position: relative; z-index: 1; }
    .smap small { display: block; margin-top: 6px; color: var(--sub); font-size: 11px; }
    /* ② 記念チケット */
    .memo-head { font-size: 11px; letter-spacing: .4em; opacity: .85; margin-bottom: 6px; }
    .memo-msg { font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 18px; font-weight: 700; margin: 6px 0 4px; }
    .tag { margin-top: 12px; font-weight: 800; color: var(--band); }
    .links { display: flex; flex-direction: column; align-items: center; }
    .shot { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: #fff; text-align: center; font-size: 13px; }
    .shot img { max-width: 100%; max-height: 75vh; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6); margin-bottom: 12px; }
    /* ⑤ 今日のカード */
    .gacha { margin-top: 14px; padding: 16px 14px; border-radius: 18px; background: var(--paper); text-align: center; }
    .gacha .k { letter-spacing: .3em; margin-bottom: 10px; }
    .gcard { width: 62%; margin: 0 auto; padding: 8px 8px 10px; border-radius: 16px; background: linear-gradient(135deg, #fdf2f7, #fbf3df); box-shadow: 0 0 0 2px #cdae6d, 0 10px 24px rgba(0,0,0,.18); }
    .gcard .ph { border-radius: 10px; }
    .gcard .nm { font-weight: 800; margin-top: 6px; }
    .gcard .role { font-size: 11px; color: var(--sub); }
    .gcard.reveal { animation: flipin 1.1s cubic-bezier(.2, 1.2, .4, 1); }
    @keyframes flipin { 0% { transform: perspective(600px) rotateY(180deg) scale(.6); opacity: 0; } 60% { opacity: 1; } 100% { transform: perspective(600px) rotateY(0) scale(1); } }
    .gcoll { margin-top: 10px; font-size: 13px; font-weight: 700; }
    .gdots { display: flex; justify-content: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .gdots span { width: 10px; height: 10px; border-radius: 50%; background: #e6dfd0; }
    .gdots span.got { background: #cdae6d; }
    .gnote { margin-top: 8px; font-size: 10px; color: var(--sub); }
    /* ① 入場の演出 */
    .fxo { position: fixed; inset: 0; z-index: 50; background: radial-gradient(circle at 50% 45%, rgba(61,52,102,.92), rgba(10,9,22,.97)); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; animation: fadein .4s; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .fxo .mc { position: absolute; width: 150vmin; height: 150vmin; max-width: 760px; max-height: 760px; opacity: .55; animation: spin 14s linear infinite, grow .9s ease-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes grow { from { transform: scale(.2); opacity: 0; } }
    .fxo .sp { position: absolute; top: -20px; color: #f6e6b8; animation: fall linear infinite; text-shadow: 0 0 8px #fff; }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    .fxc { position: relative; width: min(70vw, 260px); text-align: center; color: #fff; animation: rise 1s cubic-bezier(.2, 1.4, .4, 1) .5s both; }
    @keyframes rise { from { transform: translateY(40px) scale(.7); opacity: 0; } }
    .fxc .ph { box-shadow: 0 0 0 2px #cdae6d, 0 0 40px 6px rgba(232,183,200,.8); background: #2c2747; color: #e8b7c8; }
    .fxc .hello { font-size: 12px; letter-spacing: .4em; color: #f6e6b8; margin-bottom: 10px; }
    .fxc .nm { font-size: 20px; font-weight: 900; margin-top: 10px; text-shadow: 0 0 10px rgba(232,183,200,.9); }
    .fxc .say { margin-top: 10px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.12); font-size: 15px; line-height: 1.6; font-weight: 700; }
    .fxc .big { font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 30px; font-weight: 800; text-shadow: 0 0 16px rgba(232,183,200,.9); }
    .fxo .tap { position: absolute; bottom: calc(26px + env(safe-area-inset-bottom)); color: rgba(255,255,255,.55); font-size: 12px; }
    .spin.sm { width: 22px; height: 22px; margin: 10px auto; border-color: rgba(0,0,0,.1); border-top-color: var(--band); }
    body.d-magical .cd { background: linear-gradient(135deg, #fdeef3, #f7eedb); }
    body.d-magical .cd b { color: #3d3466; }
    body.d-magical .visit { background: #f4eefb; color: #3d3466; }
    body.d-magical .gacha { border: 1.5px solid #cdae6d; }
    body.d-magical .sgrid i.me { background: #e48aa8; }
    body.d-magical .tag { color: #b0507a; }
    .spin { width: 34px; height: 34px; margin: 60px auto; border: 3px solid rgba(255,255,255,.2); border-top-color: #cbbf9f; border-radius: 50%; animation: rot 1s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* ===== デザイン: 魔法少女 (公演ポータルで「電子チケットのデザイン」= magical の公演) =====
       夜空の紺 × 桜ピンク × ゴールド。星がまたたく背景、金の縁取り、入場済みは魔法陣のスタンプ */
    body.d-magical { --bg: #14132a; --paper: #fffafc; --ink: #29242f; --sub: #8a7f93; --line: #ecd9e2; --band: #232136; --band2: #3d3466;
      background: radial-gradient(ellipse at 50% -10%, #3d3466 0%, #1c1a38 45%, #14132a 100%) fixed; }
    body.d-magical::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .9;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 28% 72%, #fde7ef 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 46% 32%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 63% 12%, #f6e6b8 50%, transparent 51%),
        radial-gradient(2px 2px at 78% 58%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 88% 26%, #fde7ef 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 8% 86%, #f6e6b8 50%, transparent 51%), radial-gradient(1px 1px at 55% 90%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 36% 50%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 94% 80%, #fff 50%, transparent 51%);
      animation: twinkle 4s ease-in-out infinite alternate; }
    @keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }
    body.d-magical .wrap { position: relative; z-index: 1; }
    body.d-magical .brand { color: #e8b7c8; letter-spacing: .35em; }
    body.d-magical .brand::before, body.d-magical .brand::after { content: " ✦ "; color: #cdae6d; }
    body.d-magical .ticket { border: 1.5px solid #cdae6d; box-shadow: 0 0 0 4px rgba(205,174,109,.18), 0 16px 44px rgba(0,0,0,.55); }
    body.d-magical .top { position: relative; background: linear-gradient(135deg, #232136 0%, #3d3466 55%, #6b4a7a 100%); border-bottom: 1px solid #cdae6d; }
    body.d-magical .top::after { content: "✦　✧　✦"; display: block; margin-top: 10px; color: #cdae6d; font-size: 11px; letter-spacing: .3em; }
    body.d-magical .crown { color: #e8b7c8; opacity: 1; }
    body.d-magical .title { font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; color: #fff; text-shadow: 0 0 12px rgba(232,183,200,.55); }
    body.d-magical .when { color: #f6e6b8; }
    body.d-magical .seat { background: linear-gradient(135deg, #fdeef3, #f7eedb); border: 1px solid #ecd9e2; }
    body.d-magical .seat .v { color: #3d3466; }
    body.d-magical .k { color: #b0879a; }
    body.d-magical .cut { border-top-color: #e8b7c8; }
    body.d-magical .qr { box-shadow: 0 0 0 1px #cdae6d, 0 0 18px rgba(232,183,200,.45); }
    body.d-magical .dot { background: #e8b7c8; }
    body.d-magical .gift { background: #fdeef3; color: #7a3d5a; }
    body.d-magical .gift.todo { background: #fff4dc; color: #8a5a12; box-shadow: 0 0 0 2px #cdae6d inset; }
    body.d-magical .foot { color: #b9a9c9; }
    body.d-magical .msg { background: var(--paper); }
    /* 入場済み: 帯がピンク〜ゴールドに輝き、魔法陣のスタンプ */
    body.d-magical .top.in { background: linear-gradient(120deg, #e8b7c8, #cdae6d, #b9a3e3, #e8b7c8); background-size: 400% 400%; animation: flow 6s ease infinite; }
    body.d-magical .top.in .title { text-shadow: 0 1px 6px rgba(61,52,102,.5); }
    body.d-magical .top.in .when, body.d-magical .top.in .crown { color: #fff; }
    body.d-magical .top.in::after { color: #fff; }
    body.d-magical .in-badge { background: rgba(35,33,54,.35); }
    body.d-magical .v.ok { color: #b0507a; }
    body.d-magical .stamp { border: 3px double #cdae6d; color: #b0507a; background: radial-gradient(circle, #fff 55%, #fdeef3 100%); position: relative;
      box-shadow: 0 0 0 6px #fff, 0 0 0 7px #e8b7c8, 0 0 26px rgba(232,183,200,.8); }
    body.d-magical .stamp::before { content: "✦"; position: absolute; top: 8px; color: #cdae6d; font-size: 16px; }
    body.d-magical .stamp::after { content: "✧ ✦ ✧"; position: absolute; bottom: 10px; color: #cdae6d; font-size: 10px; letter-spacing: .2em; }
    body.d-magical .note { background: #f4eefb; color: #3d3466; }
    body.d-magical .clock { color: #3d3466; }
    body.d-magical .ph { background: linear-gradient(135deg, #fdeef3, #f7eedb); box-shadow: 0 0 0 1.5px #cdae6d, 0 0 16px rgba(232,183,200,.5); color: #b0879a; }
    body.d-magical .oshi .k::before, body.d-magical .oshi .k::after { content: " ✦ "; color: #cdae6d; }
    body.d-magical .oshi .nm { color: #3d3466; }
    body.d-magical .castbox { border: 1.5px solid #cdae6d; }
    body.d-magical .cast-grid .ph { box-shadow: 0 0 0 1px #cdae6d; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">E-TICKET</div>
    <div id="app"><div class="spin"></div></div>
  </div>
  <script src="qrcode.min.js"></script>
  <script>
    // 電子チケット (公演ポータルの予約1件ぶん)。URL = #api=<公演ポータルのURL>&id=<公演ID>&token=<予約のQRトークン>
    // 公演ポータルのURLはこのページに書かない (公開リポジトリなので)。# 以降はサーバーに送られない
    // 情報は開いた時に公演ポータルから取得する (このページ自体に個人情報は入っていない)。
    // 一度開いたチケットはこの端末に保存し、電波が無くてもQRは出せる。
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const P = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
    const ID = (P.get('id') || '').replace(/[^A-Za-z0-9_-]/g, '');
    const TOKEN = (P.get('token') || '').replace(/[^A-Za-z0-9_-]/g, '');
    // /a/macros/ドメイン/s/ (ログイン中のアカウント向けの形) も受け付け、公開用の /macros/s/ に直して使う
    const API = (function (u) {
      const m = String(u || '').match(/^https:\/\/script\.google\.com\/(?:a\/macros\/[^\/]+\/|a\/[^\/]+\/macros\/|macros\/)s\/([A-Za-z0-9_-]+)\/(exec|dev)$/);
      return m ? 'https://script.google.com/macros/s/' + m[1] + '/' + m[2] : '';
    })(P.get('api'));
    const CK = 'et_' + ID + '_' + TOKEN;
    const W = ['日', '月', '火', '水', '木', '金', '土'];

          + (fx.henshin ? '<br><button type="button" class="btn mini" onclick="showHenshin()">✨ 入場の演出をもう一度</button>' : '');
      } else {
        const waitText = !online ? '電波がつながると、入場状態を確認します'
          : isShowDay() ? '受付でQRが読み取られると、この画面が自動で「入場済み」に変わります'
          : '公演当日、受付でQRが読み取られると、この画面が「入場済み」に変わります';
        bottom = (fx.countdown && ph === 'before' && isShowDay() && !t.checked ? '<div class="cd"><small>開演まで</small><b id="cd">' + cdText() + '</b></div>' : '')
          + '<div class="lead">入場の時に、このQRコードをお見せください</div>'
          + '<div class="qr">' + qrSvg(data.qr) + '</div>'
          + giftHtml
          + (t.checked ? '<button type="button" class="btn" onclick="toggleQr(false)">入場済みの画面に戻る</button>'
            : '<div class="wait"><span class="dot' + (online ? '' : ' off') + '"></span><span>' + waitText + '</span></div>');
      }
      $('app').innerHTML = '<div class="ticket">'
        + '<div class="top' + (t.checked && !memo ? ' in' : '') + '">'
          + (memo ? '<div class="memo-head">MEMORIAL TICKET</div>' : '')
          + (t.checked && !memo ? '<div class="in-badge">✓ 入場済み ' + esc(hhmm(t.checkinAt)) + '</div>' : '')
          + (p.crown ? '<div class="crown">' + esc(p.crown) + '</div>' : '')
          + '<div class="title">' + esc(title || '公演') + '</div>'
          + '<div class="when">' + whenText(t) + '</div>'
          + (p.venue ? '<div class="venue">' + esc(p.venue) + '</div>' : '')
        + '</div>'
        + castHtml(true)
        + '<div class="mid">'
          + (t.seats ? '<div class="seat"><div class="k">座席</div><div class="v">' + esc(t.seats) + '</div>' + seatHtml() + '</div>' : '')
          + '<div><div class="k">お名前</div><div class="v">' + esc(t.name) + ' 様</div></div>'
          + '<div><div class="k">券種 / 枚数</div><div class="v">' + esc(t.ticketType) + ' / ' + esc(t.count) + '枚</div></div>'
          + '<div><div class="k">受付番号</div><div class="v">' + esc(t.receiveNo) + '</div></div>'
          + '<div><div class="k">入場</div><div class="v' + (t.checked ? ' ok' : '') + '">' + (t.checked ? '入場済み ' + esc(hhmm(t.checkinAt)) : '未入場') + '</div></div>'
        + '</div>'
        + visitHtml()
        + (!t.isPaid ? '<div class="warn">お支払いがまだ確認できていません。受付でお申し出ください。</div>' : '')
        + '<div class="cut"></div>'
        + '<div class="bottom">' + bottom + '</div>'
        + '</div>'
        + gachaHtml()
        + castHtml(false)
        + '<div class="foot">このURLはご本人様専用です。他の方に共有しないでください。<br>スクリーンショットではなく、この画面のままお見せください。</div>'
        + (fx.countdown && ph === 'live' && !liveHidden ? liveHtml() : '');
      startClock();
    }
    function startClock() {
      clearInterval(clockTimer);
      if (!$('clock')) return;
      const tick = () => { const d = new Date(), c = $('clock'), cd = $('cdate'); if (!c) return; c.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); cd.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 (' + W[d.getDay()] + ')'; };
      tick(); clockTimer = setInterval(tick, 1000);
    }
    window.toggleQr = (on) => { showQr = on; render(false); };

    // 公演当日だけ、入場・特典の状態を4秒おきに確かめる (入場して特典も受け取ったら止める)
    let n = 0, pollTimer = 0;
    function needPoll() { const t = data && data.ticket; return isShowDay() && t && !(t.checked && (!t.gift || t.benefit)); }
    async function poll() {
      if (!needPoll() || document.hidden) return;
      n++;
      try {
        const r = await call({ op: 'status', no: data.ticket.receiveNo, full: n % 12 === 1 });
        online = true;
        if (!r || !r.ok) return;
        if (r.cancelled) { localStorage.removeItem(CK); msg('このご予約はキャンセルされています', ''); clearInterval(pollTimer); return; }
        const t = data.ticket;
        let changed = false, pop = false;
        if (r.arrived && !t.checked) { t.checked = true; t.checkinAt = r.at || t.checkinAt; changed = true; pop = true; showQr = false; try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) { } }
        if (r.benefit !== undefined && String(r.benefit || '') !== String(t.benefit || '')) { t.benefit = String(r.benefit || ''); changed = true; }
        if (changed) { save(); render(pop); if (pop && fxOf().henshin) showHenshin(); }
      } catch (e) {
        if (online) { online = false; if (!data.ticket.checked) render(false); }
      }
      if (!needPoll()) clearInterval(pollTimer);
    }

    async function boot() {
      if (!ID || !TOKEN || !API) { msg('チケットのURLが正しくありません', 'ご予約確定メールのボタンから開き直してください。'); return; }
      data = load();
      if (data) render(false);
      try {
        const r = await call({ op: 'get' });
        if (!r || !r.ok) {
          if (r && (r.cancelled || r.notFound)) { try { localStorage.removeItem(CK); } catch (e) { } data = null; }
          if (!data) { msg(r && r.cancelled ? 'このご予約はキャンセルされています' : 'チケットを表示できませんでした', (r && r.error) || ''); return; }
        } else {
          data = { ticket: r.ticket, perf: r.perf, qr: r.qr, cast: r.cast || null, fx: r.fx || null, visits: r.visits || 0 };
          online = true;
          save();
          render(false);
          loadCast();
        }
      } catch (e) {
        online = false;
        if (data) { render(false); } else { msg('通信できませんでした', '電波の良い所で、もう一度開いてください。'); return; }
      }
      if (needPoll()) { pollTimer = setInterval(poll, 4000); poll(); }
      document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
      window.addEventListener('online', () => poll());
    }
    if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) { } }
    boot();
  </script>
</body>
</html>
